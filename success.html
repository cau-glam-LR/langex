<!-- success.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예약 완료 (Reservation Complete)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container success-container">
    <div class="card success-card">
      <h1 class="success-title">예약이 완료되었습니다!</h1>
      <p class="success-sub">언어교환 프로그램 예약이 성공적으로 접수되었습니다.<br>Your reservation has been received.</p>

      <!-- 예약 요약: 날짜(위) / 언어 · 시간(아래) -->
      <div class="summary-grid" id="reservation-summary" style="display:none;">
        <div class="summary-box summary-date">
          <div class="summary-icon"><img src="date_image.png" alt="날짜"></div>
          <div class="summary-text">
            <span>Date</span>
            <strong id="summary-date"></strong>
          </div>
        </div>
        <div class="summary-box">
          <div class="summary-icon summary-icon-emoji">🌐</div>
          <div class="summary-text">
            <span>Language</span>
            <strong id="summary-lang"></strong>
          </div>
        </div>
        <div class="summary-box">
          <div class="summary-icon"><img src="time_image.png" alt="시간"></div>
          <div class="summary-text">
            <span>Time</span>
            <strong id="summary-time"></strong>
          </div>
        </div>
      </div>

      <p class="success-note">
        <span>익일 오전 10시에 안내 문자를 보내드립니다.</span>
        <span>We will text you a confirmation at 10:00 a.m. the next day.</span>
      </p>

      <button class="success-btn" onclick="window.location.href='index.html'">새로운 예약하기 · New Reservation</button>
    </div>
  </div>

  <script>
    // index.html이 주소(URL)에 담아 보낸 예약 정보 표시
    const params = new URLSearchParams(window.location.search);
    const lang = params.get('lang');
    const date = params.get('date'); // yyyy-mm-dd
    const time = params.get('time'); // HH:MM

    if (lang && /^\d{4}-\d{2}-\d{2}$/.test(date || '') && /^\d{2}:\d{2}$/.test(time || '')) {
      const [y, m, d] = date.split('-').map(Number);
      const weekday = ['일', '월', '화', '수', '목', '금', '토'][new Date(Date.UTC(y, m - 1, d)).getUTCDay()];
      document.getElementById('summary-lang').textContent = lang;
      document.getElementById('summary-date').textContent = `${y}년 ${m}월 ${d}일 (${weekday})`;
      document.getElementById('summary-time').textContent = time;
      document.getElementById('reservation-summary').style.display = 'grid';
    }
  </script>
</body>
</html>
